<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaron's Great Beer Adventure</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="logo-img">
                <div class="title-group">
                    <h1>Aaron's Great Beer Adventure</h1>
                    <span class="subtitle">10,000+ Beers and Counting</span>
                </div>
            </div>
            <!-- Added ID for JavaScript modal trigger -->
            <button id="open-modal-btn" class="btn-primary"><i class="fa-solid fa-plus"></i> Add New Beer</button>
        </header>

        <!-- Stats Overview Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">TOTAL BEERS</span>
                <span class="stat-value" id="total-beers">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">BREWERIES</span>
                <span class="stat-value" id="total-breweries">1,334</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">AVG RATING</span>
                <div class="rating-box" style="display: flex; align-items: center; gap: 8px;">
                    <span class="stat-value" id="avg-rating-num">3.6</span>
                    <div id="avg-rating-stars" style="display: flex; align-items: center; gap: 1px;"></div>
                </div>
            </div>
        </section>

        <!-- Search and Filters Bar -->
        <section class="filter-bar">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by name, brewery...">
            </div>
            <div class="dropdown-wrapper">
                <select id="style-filter" class="dropdown-btn" style="background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; outline: none;">
                    <option value="">All Styles</option>
                </select>
                <select id="sort-select" class="dropdown-btn" style="background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; outline: none;">
                    <option value="brewery_asc">Brewery (A-Z)</option>
                    <option value="newest">Date Added (Newest)</option>
                    <option value="oldest">Date Added (Oldest)</option>
                    <option value="rank_desc">Highest Rank</option>
                    <option value="abv_desc">Highest ABV</option>
                </select>
            </div>
        </section>

        <!-- Main Table Section -->
        <section class="table-card">
            <div class="table-header-row">
                <div class="col-action">BADGE #</div>
                <div class="col-icon"></div>
                <div class="col-name">BEER / BREWERY</div>
                <div class="col-style">STYLE</div>
                <div class="col-location">ORIGIN</div>
                <div class="col-rank">RANK</div>
                <div class="col-abv">ABV</div>
                <div class="col-ibu">IBU</div>
            </div>

            <!-- Dynamic rows will be inserted here by app.js -->
            <div id="beer-container"></div>

            <!-- Pagination Footer -->
            <div id="pagination-container" style="display: flex; justify-content: space-between; align-items: center; padding: 20px; color: var(--text-muted); border-top: 1px solid var(--border-color);">
                <button id="prev-btn" class="btn-page" disabled style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer;">Previous</button>
                <span id="page-indicator">Page 1 of 201</span>
                <button id="next-btn" class="btn-page" style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer;">Next</button>
            </div>
        </section>
    </div>

    <!-- Add Beer Modal -->
    <div id="add-beer-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #111827; border: 1px solid rgba(255,255,255,0.1); padding: 24px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
            
            <!-- Header with Sequential Number & Date -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color: var(--text-main); margin: 0; font-size: 18px;">Log New Beer</h3>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span id="modal-badge-preview" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;">#--</span>
                    <input type="date" id="new-consumption-date" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 2px 6px; border-radius: 6px; font-size: 12px;">
                </div>
            </div>
            
            <form id="quick-beer-form" style="display: flex; flex-direction: column; gap: 14px;" autocomplete="off">
                <!-- Hidden inputs for auto-populated background data -->
                <input type="hidden" id="new-country">
                <input type="hidden" id="new-state">

                <!-- Brewery Name with Custom Visible Dropdown Suggestions -->
                <div style="position: relative;">
                    <label style="display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px;">Brewery Name</label>
                    <input type="text" id="new-brewery" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: var(--text-main); font-size: 14px;" placeholder="Select or type new brewery...">
                    
                    <div id="brewery-suggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: #1f2937; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; max-height: 160px; overflow-y: auto; z-index: 10; margin-top: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);"></div>
                </div>

                <!-- Beer Name -->
                <div>
                    <label style="display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px;">Beer Name</label>
                    <input type="text" id="new-beer-name" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: var(--text-main); font-size: 14px;" placeholder="Type new beer...">
                </div>

                <!-- Rank / Rating: Blue Star Selector -->
                <div>
                    <label style="display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px;">Rank / Rating (1.0 to 5.0)</label>
                    <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px;">
                        <div id="star-container" style="display: flex; cursor: pointer; gap: 4px; font-size: 22px; color: #3b82f6;">
                            ★★★★★
                        </div>
                        
                        <!-- Single consolidated half-star button -->
                        <button type="button" id="half-star-btn" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--text-muted); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;">+.5</button>
                        
                        <span id="rank-numeric-display" style="font-size: 15px; font-weight: 600; color: var(--text-main);">--</span>
                        <input type="hidden" id="new-rank" value="">
                    </div>
                </div>

                <!-- Tasting Notes -->
                <div>
                    <label style="display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px;">Tasting Notes</label>
                    <textarea id="new-tasting-notes" rows="2" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: var(--text-main); font-size: 14px; resize: vertical;" placeholder="Optional notes, aromas, flavors..."></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px;">
                    <button type="button" id="close-modal-btn" style="background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;">Cancel</button>
                    <button type="submit" style="background: #3b82f6; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">Save Beer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
